<!DOCTYPE html>
<html lang="en">

<head>
    <title>PS University - สมัครเรียนออนไลน์</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>

<body>
<header>
  <img src="image/PS-logo.jpg" alt="Logo" class="logo">
  <h2>PS University</h2>
  <h5>แบบฟอร์มสมัครเรียน</h5>
</header>

<section>
  <nav>
    <ul>
      <li><h3><a href="index.html">กลับไปหน้าหลัก</a></h3></li>
    </ul>
  </nav>
  
  <article-2>
    <h1>กรอกฟอร์มสมัครเรียน</h1>
    <h4>กรุณากรอกข้อมูลให้ครบถ้วน</h4>
        <form>
            <!-- ข้อมูลส่วนชื่อ -->
            <label for="first_name_th">ชื่อ (ภาษาไทย) :</label><br>
                <input type="text" id="first_name_th" name="first_name_th" required>
            <br>

            <label for="last_name_th">นามสกุล (ภาษาไทย) :</label><br>
                <input type="text" id="last_name_th" name="last_name_th" required>
            <br><br>

            <label for="first_name_eng">ชื่อ (ภาษาอังกฤษ) :</label><br>
                <input type="text" id="first_name_eng" name="first_name_eng" required>
            <br>

            <label for="last_name_eng">นามสกุล (ภาษาอังกฤษ) :</label><br>
                <input type="text" id="last_name_eng" name="last_name_eng" required>
            <br><br>
            <!-- ท้ายข้อมูลส่วนชื่อ -->

            <!-- ข้อมูลส่วนกรุ๊ปเลือดและศาสนา (แบบตัวเลือก option) -->
            <label for="blood_type">กรุ๊ปเลือด</label><br>
                <select id="blood_type" name="blood_type" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="AB">AB</option>
                    <option value="O">O</option>
                </select>
            <br>

             <label for="religion">ศาสนา</label><br>
                <select id="religion" name="religion" required>
                    <option value="พุทธ">พุทธ</option>
                    <option value="คริสต์">คริสต์</option>
                    <option value="อิสลาม">อิสลาม</option>
                    <option value="hindu">ฮินดู</option>
                </select>
            <br>
            <!-- ท้ายข้อมูลส่วนกรุ๊ปเลือดและศาสนา (แบบตัวเลือก option) -->

            <!-- ข้อมูลส่วนวันเกิด น้ำหนัก ส่วนสูง -->
            <label for="date">วันเกิด :</label><br>
                <input type="date" id="date" name="date" required>
            <br>

            <label for="weight">น้ำหนัก (กก.) :</label><br>
                <input type="number" id="weight" name="weight" min="30" max="200" required>
            <br>

            <label for="height">ส่วนสูง (ซม.) :</label><br>
                <input type="number" min="30" max="250" required>
            <br><br>
            <!-- ท้ายข้อมูลส่วนวันเกิด น้ำหนัก ส่วนสูง -->

            <!-- ข้อมูลส่วนเบอร์โทรติดต่อและอีเมล -->
                 <label for="phone">เบอร์โทรติดต่อ :</label><br>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
                <br>

                <label for="email">email :</label><br>
                    <input type="email" id="email" name="email">
                <br><br>
            <!-- ท้ายข้อมูลส่วนเบอร์โทรติดต่อและอีเมล -->

            <!-- ข้อมูลส่วนเอกสารที่ต้องแนบ -->
            <label for="file_photo">1. ภาพถ่ายหน้าตรง (สุภาพเรียบร้อย) 1 รูป (.jpg ขนาดไม่เกิน 5 MB) :</label><br>
                <input type="file" required>
            <br><br>

            <label for="file_id">2. สำเนาบัตรประชาชน 1 ฉบับ (.pdf ขนาดไม่เกิน 5 MB) :</label><br>
                <input type="file" required>
            <br><br>

            <label for="file_household">3. สำเนาทะเบียนบ้าน 1 ฉบับ (.pdf ขนาดไม่เกิน 5 MB) :</label><br>
                <input type="file" required>
            <br><br>

            <label for="file_transcript">4. สำเนาใบ ปพ. 1 ฉบับ (.pdf ขนาดไม่เกิน 5 MB):</label><br>
                <input type="file" required>
            <br><br>
            <!-- ท้ายข้อมูลส่วนเอกสารที่ต้องแนบ -->

            <!-- ข้อมูลส่วนอื่นๆ -->
            <label for="end_school">สถานที่จบการศึกษา :</label><br>
                <input type="text" required>
            <br>

            <label for="gpa">GPA:</label><br>
                <input type="text" required>
            <br><br>
            <!-- ท้ายข้อมูลส่วนอื่นๆ -->

            <!-- ข้อมูลส่วนสาขาที่ต้องการสมัครเรียน (แบบตัวเลือก radio) -->
            <label for="fav_branch">สาขาที่ต้องการสมัครเรียน :</label><br>
                <input type="radio" id="IT" name="fav_branch" value="IT">
                    <label for="html">IT</label>
                <br>

                <input type="radio" id=" ITI" name="fav_branch" value=" ITI">
                    <label for="css"> ITI</label>
                <br>

                <input type="radio" id="ITT" name="fav_branch" value="ITT">
                    <label for="javascript">ITT</label>
                <br>

                <input type="radio" id="INE" name="fav_branch" value="INE">
                    <label for="javascript">INE</label>
                <br>

                <input type="radio" id="INET" name="fav_branch" value="INET">
                    <label for="javascript">INET</label>
                <br><br>
                <!-- ท้ายข้อมูลส่วนสาขาที่ต้องการสมัครเรียน (แบบตัวเลือก radio) -->

            
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
</form>
  </article-2>
</section>
